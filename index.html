<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FF7A2F">
<meta name="description" content="A year-long Vedic maths game: all 16 sutras and 13 upasutras, with picture stories, missions, practice and a Hero Lab.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ninja Maths">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Ninja Maths Dojo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: one-column phone app on a tatami-mat ground; chunky game buttons, character stage on top */
:root{
  --bg:#EEF2DC; --mat:#E2E8C4; --line:#CDD5AA;
  --ink:#1F2A4D; --muted:#5B6683; --card:#FFFFFF;
  --accent:#FF7A2F; --accent-d:#D9560E;
  --leaf:#2E9E6B; --leaf-d:#1F7A50;
  --gold:#F5B700; --gold-d:#C98A00;
  --wrong:#E0445A; --wrong-bg:#FFE4E8; --right-bg:#DDF5E8;
  --display:'Baloo 2', 'Trebuchet MS', system-ui, sans-serif;
  --body:'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme:light;
}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;
  background-image:repeating-linear-gradient(90deg,transparent 0 46px,rgba(120,135,70,.07) 46px 48px);}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.app{max-width:540px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
h2{font-size:1.45rem}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-weight:800;font-size:1.5rem;letter-spacing:.2px}
.brand small{display:block;font-family:var(--body);font-weight:700;font-size:.78rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.starpill{display:flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 12px 4px 8px;font-weight:800;font-variant-numeric:tabular-nums}
.starpill svg{width:22px;height:22px}
.iconbtn{width:44px;height:44px;border-radius:14px;background:var(--card);border:2px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:1.2rem}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:26px;padding:14px}
.stage{background:radial-gradient(circle at 50% 70%,#FFF6D6 0 45%,transparent 46%),var(--mat);border-radius:20px;aspect-ratio:4/5;max-width:100%;display:grid;place-items:center;overflow:hidden}
.stage svg{width:92%;height:auto}
.rank{display:flex;flex-direction:column;gap:10px;min-width:0}
.ninjaname{font-family:var(--display);font-weight:800;font-size:1.6rem;overflow-wrap:anywhere}
.belt{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:.95rem}
.belt i{width:34px;height:12px;border-radius:4px;border:1.5px solid rgba(0,0,0,.25);display:inline-block}
.meta{color:var(--muted);font-weight:700;font-size:.92rem}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:18px;font-family:var(--display);font-weight:800;font-size:1.2rem;background:var(--accent);color:#fff;box-shadow:0 5px 0 var(--accent-d);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--accent-d)}
.btn.green{background:var(--leaf);box-shadow:0 5px 0 var(--leaf-d)}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.block{width:100%}
.btn.small{min-height:42px;font-size:1rem;padding:0 14px}

/* path */
.path{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;position:relative}
.path::before{content:"";position:absolute;left:31px;top:20px;bottom:20px;width:4px;background:var(--line);border-radius:4px}
.unit{position:relative;display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:10px 12px 10px 10px}
.unit[disabled]{opacity:.6;cursor:default;background:#F6F8EC}
.disc{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:800;font-size:1.3rem;margin-left:4px;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.unit .t{font-family:var(--display);font-weight:800;font-size:1.12rem;line-height:1.15}
.unit .s{font-size:.84rem;color:var(--muted);font-weight:700;font-style:italic;overflow-wrap:anywhere}
.tag{font-size:.78rem;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--mat);white-space:nowrap}
.tag.new{background:var(--accent);color:#fff}
.tag.perfect{background:var(--gold);color:var(--ink)}
.tag.done{background:var(--right-bg);color:var(--leaf-d)}
.beltmini{display:inline-block;width:20px;height:8px;border-radius:3px;border:1px solid rgba(0,0,0,.25);vertical-align:middle;margin-left:6px}

/* unit screen */
.uhead{display:flex;gap:12px;align-items:center}
.uhead .disc{flex:none;margin:0}
.sutra{color:var(--muted);font-weight:700;font-style:italic}
.kid{background:#FFF1E6;border:2px dashed #FFB98A;border-radius:18px;padding:10px 14px;font-weight:800}
.lesson{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:12px;min-height:290px}
.lesson h3{font-size:1.35rem}
.lesson p{margin:0}
.ex{background:var(--bg);border-radius:16px;padding:12px 14px}
.exq{font-family:var(--display);font-weight:800;font-size:1.6rem}
.ex ol{margin:6px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:4px}
.exa{font-family:var(--display);font-weight:800;font-size:1.3rem;color:var(--leaf-d);margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--bg);border-radius:12px;padding:6px 12px;font-family:var(--display);font-weight:800;font-size:1.2rem}
pre.lay{margin:0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.15rem;font-weight:700;background:var(--bg);border-radius:14px;padding:10px 14px;overflow-x:auto}
.tip{font-size:.92rem;color:var(--muted);font-weight:700}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dots{display:flex;gap:6px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent);width:22px;border-radius:6px}

/* quiz */
.qbar{display:flex;align-items:center;gap:12px}
.prog{flex:1;height:14px;background:var(--mat);border-radius:999px;overflow:hidden}
.prog b{display:block;height:100%;background:var(--leaf);border-radius:999px;transition:width .3s}
.qcard{background:var(--card);border:2px solid var(--line);border-radius:26px;padding:18px;text-align:center;display:flex;flex-direction:column;gap:12px}
.qnum{font-weight:800;color:var(--muted);font-size:.85rem;letter-spacing:.06em;text-transform:uppercase}
.qtext{font-family:var(--display);font-weight:800;font-size:clamp(2rem,10vw,3rem);line-height:1.05;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.qtext.smallq{font-size:clamp(1.5rem,7vw,2.1rem)}
.answer{min-height:64px;border-radius:18px;border:3px dashed var(--line);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:2.2rem;font-variant-numeric:tabular-nums}
.answer.ok{border-style:solid;border-color:var(--leaf);background:var(--right-bg);color:var(--leaf-d)}
.answer.bad{border-style:solid;border-color:var(--wrong);background:var(--wrong-bg);color:var(--wrong)}
.pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pad button{height:62px;border-radius:18px;background:var(--card);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);font-family:var(--display);font-weight:800;font-size:1.8rem}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.pad .go{background:var(--leaf);border-color:var(--leaf);color:#fff;box-shadow:0 4px 0 var(--leaf-d)}
.pad .del{font-size:1.2rem}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.choices button{min-height:66px;border-radius:18px;background:var(--card);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);font-family:var(--display);font-weight:800;font-size:1.45rem;padding:6px}
.choices button.ok{background:var(--right-bg);border-color:var(--leaf)}
.choices button.bad{background:var(--wrong-bg);border-color:var(--wrong)}
.fb{border-radius:20px;padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:8px}
.fb.ok{background:var(--right-bg)}
.fb.bad{background:var(--wrong-bg)}
.fb h3{font-size:1.3rem}
.fb ol{margin:0;padding-left:22px;font-weight:700;display:flex;flex-direction:column;gap:3px}

/* result */
.result{background:var(--card);border:2px solid var(--line);border-radius:26px;padding:20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.bigscore{font-family:var(--display);font-weight:800;font-size:3.4rem;line-height:1}
.starrow{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.starrow svg{width:26px;height:26px}
.gifts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.gift{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-height:210px;justify-content:center}
.gift.rare{background:linear-gradient(160deg,#FFF6CF,#FFE38A);border-color:var(--gold)}
.gift .box{width:110px;height:110px}
.gift .box svg{width:100%;height:100%}
.gift.closed .box{animation:wiggle 1.4s ease-in-out infinite}
.gift .lbl{font-family:var(--display);font-weight:800;font-size:1.05rem;line-height:1.15}
.gift .sub{font-size:.82rem;color:var(--muted);font-weight:700}
.gift .prev{width:120px}
.gift.wide{grid-column:1 / -1;min-height:0;flex-direction:row;justify-content:flex-start;text-align:left;gap:12px;padding:12px 16px}
@keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-7deg)}40%{transform:rotate(6deg)}60%{transform:rotate(-3deg)}}
.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.4);opacity:.2}to{transform:scale(1);opacity:1}}

/* wardrobe */
.wardgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.item{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.item svg{width:100%;max-width:90px;height:auto}
.item .nm{font-weight:800;font-size:.78rem;line-height:1.15}
.item.on{border-color:var(--leaf);background:var(--right-bg)}
.item.rare.on{border-color:var(--gold);background:#FFF3C4}
.item.locked{border-style:dashed;background:transparent;cursor:default}
.item.locked .q{width:64px;height:78px;border-radius:14px;background:var(--mat);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:2rem;color:var(--muted)}
.item .how{font-size:.7rem;color:var(--muted);font-weight:700}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:48px;height:48px;border-radius:14px;border:3px solid var(--line)}
.sw.on{border-color:var(--ink);box-shadow:0 0 0 3px var(--card) inset}
.sw.locked{opacity:.35;border-style:dashed;cursor:default}
.namebox{display:flex;gap:8px;align-items:center}
.namebox input{flex:1;min-width:0;height:48px;border-radius:14px;border:2px solid var(--line);padding:0 12px;font:inherit;font-weight:800;background:var(--card);color:var(--ink)}
.panel{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:12px}
.danger{color:var(--wrong);font-weight:800;text-decoration:underline;align-self:flex-start}
.note{font-size:.88rem;color:var(--muted);font-weight:700}
/* speed */
.bi{width:1.1em;height:1.1em;vertical-align:-.18em;margin-right:4px}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.records.onpage div{background:var(--card);border:2px solid var(--line)}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:12px 14px;box-shadow:0 4px 0 var(--line)}
.mode b{font-family:var(--display);font-weight:800;font-size:1.2rem;line-height:1.1}
.mode span{font-size:.85rem;color:var(--muted);font-weight:700}
.mode:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.mode.ta{grid-column:1 / -1;background:var(--ink);border-color:var(--ink);color:#fff;box-shadow:0 4px 0 #0E1530}
.mode.ta span{color:#C9D2EE}
.records{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;width:100%}
.records div{background:var(--bg);border-radius:14px;padding:8px 10px;display:flex;flex-direction:column;text-align:left}
.records span{font-size:.75rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.records b{font-family:var(--display);font-size:1.3rem;font-variant-numeric:tabular-nums}
.clock{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;text-align:left}
.ctrack{grid-column:1 / -1;height:12px;border-radius:999px;background:var(--mat);overflow:hidden}
.ctrack b{display:block;height:100%;border-radius:999px;transition:width .1s linear,background .2s}
.clock.z3 .ctrack b{background:var(--leaf)} .clock.z2 .ctrack b{background:var(--gold)} .clock.z1 .ctrack b{background:var(--line)}
.ctime{font-weight:800;font-variant-numeric:tabular-nums;color:var(--muted)}
.czone{font-weight:800;font-size:.9rem;padding:2px 10px;border-radius:999px}
.clock.z3 .czone{background:var(--right-bg);color:var(--leaf-d)} .clock.z2 .czone{background:#FFF1C2;color:#8A5E00} .clock.z1 .czone{background:var(--mat);color:var(--muted)}
.prog.tap b{background:var(--accent);transition:width .1s linear}
.tatime{font-family:var(--display);font-weight:800;font-size:1.8rem;min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
.tatime.hurry{color:var(--wrong);animation:pulse .5s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.15)}}
.fb.sp3{background:linear-gradient(120deg,#DDF5E8,#FFF3C4)}
.gift.speed{background:linear-gradient(160deg,#E3EEFF,#BFD7FF);border-color:#2F80ED}
.item.spd.on{border-color:#2F80ED;background:#E3EEFF}
.exbtns{display:flex;gap:10px;flex-wrap:wrap}
.mstage.practice{border-color:var(--leaf);box-shadow:0 4px 0 var(--leaf-d);background:#EAF7EF}
.mstage.practice .sn,.mstage.practice .sg{background:var(--leaf);color:#fff}
#pcode{width:100%;border:2px solid var(--line);border-radius:12px;padding:8px 10px;font:inherit;font-size:.8rem;background:var(--card);color:var(--ink);resize:vertical;word-break:break-all}
.testrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-top:2px dashed var(--line);padding-top:14px}
.rules{display:flex;flex-direction:column;gap:10px}
.rok,.rno{border-radius:14px;padding:10px 12px}
.rok{background:var(--right-bg)}
.rno{background:var(--wrong-bg)}
.rok b{color:var(--leaf-d)}
.rno b{color:var(--wrong)}
.rules ul{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
.testbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:#FFF1C2;border:2px dashed var(--gold-d);border-radius:16px;padding:10px 12px;font-weight:700;font-size:.92rem}
/* all sutras + hero lab */
.qtext,.exq{white-space:pre-line}
.path .phase{list-style:none;font-family:var(--display);font-weight:800;font-size:1.05rem;color:var(--muted);padding:12px 4px 0;position:relative;z-index:1;background:var(--bg)}
.power{display:flex;flex-direction:column;gap:4px;font-size:.85rem}
.ptop{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}
.ptop span{font-weight:800;color:var(--accent-d)}
.pbar{height:12px;background:var(--mat);border-radius:999px;overflow:hidden}
.pbar b{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:999px}
.power small{color:var(--muted);font-weight:700}
.item .pw,.food .pw{font-size:.72rem;font-weight:800;color:var(--accent-d)}
.sub2{display:flex;flex-direction:column;gap:6px}
.spcgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.spc{background:var(--bg);border:2px solid var(--line);border-radius:16px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;font-weight:800;font-size:.75rem}
.spc svg{width:100%;max-width:70px;height:auto}
.spc.on{border-color:var(--accent);background:#FFF1E6}
.spc[disabled]{opacity:.45;cursor:default}
.foods{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.food{background:var(--bg);border-radius:16px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.ficon svg{width:44px;height:44px;display:block}
.fn{font-weight:800;font-size:.8rem;line-height:1.1}
.food .btn{min-height:34px;padding:0 12px;font-size:1rem;gap:4px}
.food .btn svg{width:16px;height:16px}
.yumbar{background:#D3F9D8;border:2px solid var(--leaf);border-radius:16px;padding:10px 14px;font-weight:700}
.stage.yum svg{animation:bounce .6s ease}
@keyframes bounce{30%{transform:translateY(-12px) scale(1.04)}60%{transform:translateY(0)}}
/* story pictures + missions */
.scenewrap{border-radius:18px;overflow:hidden;line-height:0;width:100%}
.scene{width:100%;height:auto;display:block}
.scene text{font-family:var(--display);font-weight:800}
.fbpic{max-width:300px;width:100%;align-self:center}
.herobtns{display:flex;flex-direction:column;gap:8px}
.stages{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.mstage{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px 12px;box-shadow:0 4px 0 var(--line)}
.mstage .sn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.2rem;background:var(--mat);color:var(--muted)}
.mstage .sx b{display:block;font-family:var(--display);font-size:1.15rem;line-height:1.15}
.mstage .sx small{font-weight:700;color:var(--muted);font-size:.82rem}
.mstage .sg{font-weight:800;font-size:.8rem;padding:3px 10px;border-radius:999px;background:var(--mat)}
.mstage.cur{border-color:var(--accent);box-shadow:0 4px 0 var(--accent-d)}
.mstage.cur .sn,.mstage.cur .sg{background:var(--accent);color:#fff}
.mstage.done{border-color:#A9DCC2;box-shadow:0 4px 0 #A9DCC2}
.mstage.done .sn{background:var(--leaf);color:#fff}
.mstage.done .sg{background:var(--right-bg);color:var(--leaf-d)}
.mstage.lock{opacity:.55;box-shadow:none;border-style:dashed;cursor:default}
.mstage.ta.cur{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:0 4px 0 #0E1530}
.mstage.ta.cur small{color:#C9D2EE}
.mstage:not(.lock):active{transform:translateY(3px)}
.passpill{font-weight:800;font-size:.85rem;padding:3px 12px;border-radius:999px}
.passpill.ok{background:var(--right-bg);color:var(--leaf-d)}
.passpill.no{background:var(--wrong-bg);color:var(--wrong)}
.cardlist{display:flex;flex-direction:column;gap:14px}

<script>
/* ---------- data ---------- */
const BELTS=[{n:'White',c:'#F7F7F0'},{n:'Yellow',c:'#FFD60A'},{n:'Orange',c:'#FF8C1A'},{n:'Green',c:'#2BA84A'},{n:'Blue',c:'#2F6FDE'},{n:'Brown',c:'#8B5A2B'},{n:'Black',c:'#16161D'}];
const GIS=[{n:'Snow',c:'#FFFFFF',d:'#C3CAD8'},{n:'Sky',c:'#9FDBFF',d:'#58A9D6'},{n:'Cherry',c:'#FF8585',d:'#CC4D52'},{n:'Grape',c:'#BEA2F7',d:'#8467C9'},{n:'Mint',c:'#8BE0B4',d:'#46A877'},{n:'Sunny',c:'#FFD36B',d:'#D3A033'},{n:'Midnight',c:'#36406A',d:'#6A74A8'}];
const ITEMS={
  headband:{n:'Red Headband'}, sneakers:{n:'Speedy Sneakers',slot:'feet'}, sunglasses:{n:'Cool Shades',slot:'eyes'},
  wristbands:{n:'Power Wristbands'}, scarf:{n:'Ninja Scarf'}, cap:{n:'Blue Cap',slot:'hat'},
  backpack:{n:'Maths Backpack',slot:'back'}, staff:{n:'Bamboo Staff',slot:'weapon',pw:10,kind:'weapon'}, bowtie:{n:'Fancy Bow Tie'},
  badge:{n:'Star Badge'}, mask:{n:'Ninja Mask'}, cape:{n:'Hero Cape',slot:'cape'},
  crown:{n:'Golden Crown',slot:'hat',rare:1}, dragon:{n:'Baby Dragon',rare:1}, wand:{n:'Star Wand',rare:1,slot:'weapon',pw:20,kind:'weapon'},
  rainbow:{n:'Rainbow Cape',slot:'cape',rare:1}, medal:{n:'Champion Medal',rare:1}, aura:{n:'Golden Glow',rare:1},
  goggles:{n:'Racing Goggles',slot:'eyes',speed:1}, bolt:{n:'Lightning Bolt',speed:1},
  boots:{n:'Flame Boots',slot:'feet',speed:1}, jetpack:{n:'Rocket Jetpack',slot:'back',speed:1},
  sword:{n:'Hero Sword',slot:'weapon',pw:12,kind:'weapon'}, shield:{n:'Star Shield',slot:'left',pw:12,kind:'weapon'}, bow:{n:'Bow and Arrow',slot:'left',pw:12,kind:'weapon'},
  hammer:{n:'Thunder Hammer',slot:'weapon',pw:18,kind:'weapon'}, spear:{n:'Ice Spear',slot:'weapon',pw:15,kind:'weapon'},
  helmet:{n:'Knight Helmet',slot:'hat',pw:10}, armor:{n:'Gold Armour',slot:'body',pw:15}, wings:{n:'Power Wings',slot:'back',pw:15}
};
const REG=['headband','sword','sneakers','shield','sunglasses','bow','wristbands','helmet','scarf','hammer','cap','armor','backpack','spear','bowtie','wings','badge','mask','cape','staff'];
const RARE=['crown','dragon','wand','rainbow','medal','aura'];
const SPEED=['goggles','bolt','boots','jetpack'];
/* seconds for a "lightning" answer, per unit (plus half a second per answer digit); "quick" is double */
const BASE=[4,5,5,5,7,5,6,14,6,9];
const limitOf=(q,u)=>BASE[u]+(q.choices?1:String(q.a).length)*.5;
const speedOf=(q,u,t)=>{const l=limitOf(q,u);return t<=l?3:t<=l*2?2:1};
const SPEEDNAME={3:'Lightning',2:'Quick',1:'Steady'};
/* four missions per sutra, passed in order */
const STAGES=[{k:'q',n:'Quick',mode:'10',sub:'10 questions'},{k:'t',n:'Training',mode:'20',sub:'20 questions'},{k:'m',n:'Master',mode:'30',sub:'30 questions'},{k:'ta',n:'Lightning Round',mode:'ta',sub:'60 seconds'}];
const taTarget=u=>Math.max(3,Math.round(60/(BASE[u]*1.5)));
const needOf=(u,mode)=>mode==='10'?7:mode==='20'?14:mode==='30'?24:taTarget(u);
const stageOf=mode=>STAGES.find(s=>s.mode===String(mode));

/* ---------- helpers ---------- */
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const p2=n=>String(n).padStart(2,'0');
const ds=n=>String(n).split('').reduce((a,b)=>a+ +b,0);
const dr=n=>{let s=n;while(s>9)s=ds(s);return s===9?0:s};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const ex=(q,steps,a)=>`<div class="ex"><div class="exq">${q}</div><ol>${steps.map(s=>`<li>${s}</li>`).join('')}</ol>${a?`<div class="exa">${a}</div>`:''}</div>`;

/* ---------- question makers ---------- */
const G=[];
G[0]=()=>{const t=ri(0,3);
  if(t===3){const a=ri(1,9);let b;do{b=ri(2,9)}while(b===a||b===10-a);return{q:`${a} + ${b} + ${10-a}`,a:10+b,steps:[`Find the Ten Friends: ${a} + ${10-a} = 10.`,`10 + ${b} = ${10+b}`]}}
  if(t===0){const a=ri(6,9),n=10-a,b=ri(n+1,9);return{q:`${a} + ${b}`,a:a+b,steps:[`${a} needs ${n} to make 10.`,`${b} gives ${n} and keeps ${b-n}.`,`10 + ${b-n} = ${a+b}`]}}
  if(t===1){const x=ri(1,8)*10+ri(5,9),n=10-x%10,b=ri(n+1,9);return{q:`${x} + ${b}`,a:x+b,steps:[`${x} needs ${n} to make ${x+n}.`,`${b} gives ${n} and keeps ${b-n}.`,`${x+n} + ${b-n} = ${x+b}`]}}
  const x=ri(1,6)*10+ri(6,9),n=10-x%10,y=ri(1,3)*10+ri(n,9);return{q:`${x} + ${y}`,a:x+y,steps:[`${x} needs ${n} to make ${x+n}.`,`${y} gives ${n} and becomes ${y-n}.`,`${x+n} + ${y-n} = ${x+y}`]}};
G[1]=()=>{const t=ri(0,5);
  if(t===0){const n=ri(12,89);return{q:`${n} + 9`,a:n+9,steps:[`9 is a 10 in disguise: ${n} + 10 = ${n+10}.`,`Take the missing 1 away: ${n+10} − 1 = ${n+9}.`]}}
  if(t===1){const n=ri(20,99);return{q:`${n} − 9`,a:n-9,steps:[`${n} − 10 = ${n-10}.`,`We took 1 too many, give it back: ${n-10} + 1 = ${n-9}.`]}}
  if(t===2){const n=ri(12,89);return{q:`${n} + 8`,a:n+8,steps:[`${n} + 10 = ${n+10}.`,`8 is missing 2 buttons: ${n+10} − 2 = ${n+8}.`]}}
  if(t===3){const n=ri(20,99);return{q:`${n} − 8`,a:n-8,steps:[`${n} − 10 = ${n-10}.`,`Give 2 back: ${n-10} + 2 = ${n-8}.`]}}
  if(t===4){const n=ri(101,899);return{q:`${n} + 99`,a:n+99,steps:[`99 is 100 in disguise: ${n} + 100 = ${n+100}.`,`Take 1 away: ${n+99}.`]}}
  const n=ri(150,999);return{q:`${n} − 99`,a:n-99,steps:[`${n} − 100 = ${n-100}.`,`Give 1 back: ${n-99}.`]}};
G[2]=()=>{const t=ri(0,5);
  if(t===5){let n;do{n=ri(1001,9989)}while(n%10===0);const d=String(n).split('').map(Number);return{q:`10000 − ${n}`,a:10000-n,steps:[`All from 9: ${9-d[0]}, ${9-d[1]}, ${9-d[2]}.`,`Last from 10: 10 − ${d[3]} = ${10-d[3]}.`,`Answer: ${10000-n}`]}}
  if(t<=1){let n;do{n=ri(11,98)}while(n%10===0);const a=Math.floor(n/10),b=n%10;return{q:`100 − ${n}`,a:100-n,steps:[`All from 9: 9 − ${a} = ${9-a}.`,`Last from 10: 10 − ${b} = ${10-b}.`,`Answer: ${100-n}`]}}
  if(t<=3){let n;do{n=ri(101,989)}while(n%10===0);const d=String(n).split('').map(Number);return{q:`1000 − ${n}`,a:1000-n,steps:[`9 − ${d[0]} = ${9-d[0]}`,`9 − ${d[1]} = ${9-d[1]}`,`Last from 10: 10 − ${d[2]} = ${10-d[2]}`,`Answer: ${1000-n}`]}}
  const n=ri(1,9);return{q:`100 − ${n}`,a:100-n,steps:[`Think of ${n} as 0${n}.`,`9 − 0 = 9 and 10 − ${n} = ${10-n}.`,`Answer: ${100-n}`]}};
G[3]=()=>{const t=ri(0,5);
  if(t===5){const n=ri(2,9);return{q:`${n} × 99`,a:n*99,steps:[`Left twin: ${n} − 1 = ${n-1}.`,`Right twin: 99 − ${n-1} = ${99-n+1}.`,`Join: ${n*99}`]}}
  if(t===0){const n=ri(2,9);return{q:`${n} × 9`,a:n*9,steps:[`Left twin: one less than ${n} is ${n-1}.`,`Right twin: ${n-1} needs ${10-n} to reach 9.`,`Join the twins: ${n*9}`]}}
  if(t<=3){const n=ri(11,98),l=n-1,r=99-l;return{q:`${n} × 99`,a:n*99,steps:[`Left twin: ${n} − 1 = ${l}.`,`Right twin: 99 − ${l} = ${p2(r)}.`,`Join: ${n*99}`]}}
  const n=ri(101,998),l=n-1,r=999-l;return{q:`${n} × 999`,a:n*999,steps:[`Left twin: ${n} − 1 = ${l}.`,`Right twin: 999 − ${l} = ${String(r).padStart(3,'0')}.`,`Join: ${n*999}`]}};
G[4]=()=>{const t=ri(0,3);let a,b,s=[],c,p;
  if(t===0){a=ri(6,9);b=ri(6,9);const da=10-a,db=10-b;c=a-db;p=da*db;s=[`Steps from 10: ${a} is ${da} below, ${b} is ${db} below.`,`Cross: ${a} − ${db} = ${c}.`,`Down: ${da} × ${db} = ${p}.`];
    if(p>=10)s.push(`${p} is too big for one place: the ${Math.floor(p/10)} jumps left → ${c+Math.floor(p/10)} and ${p%10}.`)}
  else if(t===1){a=ri(11,15);b=ri(11,15);const da=a-10,db=b-10;c=a+db;p=da*db;s=[`Steps above 10: ${da} and ${db}.`,`Cross: ${a} + ${db} = ${c}.`,`Down: ${da} × ${db} = ${p}.`];
    if(p>=10)s.push(`The ${Math.floor(p/10)} jumps left → ${c+Math.floor(p/10)} and ${p%10}.`)}
  else if(t===2){a=ri(91,99);b=ri(91,99);const da=100-a,db=100-b;c=a-db;p=da*db;s=[`Steps from 100: ${da} and ${db} below.`,`Cross: ${a} − ${db} = ${c}.`,`Down: ${da} × ${db} = ${p2(p)} (always two digits).`]}
  else{a=ri(101,109);b=ri(101,109);const da=a-100,db=b-100;c=a+db;p=da*db;s=[`Steps above 100: ${da} and ${db}.`,`Cross: ${a} + ${db} = ${c}.`,`Down: ${da} × ${db} = ${p2(p)} (always two digits).`]}
  s.push(`Answer: ${a*b}`);return{q:`${a} × ${b}`,a:a*b,steps:s}};
G[5]=()=>{if(ri(0,3)<3){const n=ri(12,99),t=Math.floor(n/10),u=n%10,f=t+u,s=[`Bread: ${t} and ${u}.`,`Filling: ${t} + ${u} = ${f}.`];
    if(f>=10)s.push(`Too much filling! Keep ${f%10} in the middle, the 1 squeezes into the left bread: ${t+1}.`);s.push(`Answer: ${n*11}`);return{q:`${n} × 11`,a:n*11,steps:s}}
  let a,b,c;do{a=ri(1,8);b=ri(0,8);c=ri(0,8)}while(a+b>9||b+c>9);const n=a*100+b*10+c;
  return{q:`${n} × 11`,a:n*11,steps:[`Bread: ${a} and ${c}.`,`Fillings: ${a} + ${b} = ${a+b} and ${b} + ${c} = ${b+c}.`,`Answer: ${n*11}`]}};
G[6]=()=>{const t=ri(0,4);if(t===4){const n=ri(10,12),m=n*10+5;return{q:`${m} × ${m}`,a:m*m,steps:[`The front is ${n}. It takes the One-More Lift to ${n+1}.`,`${n} × ${n+1} = ${n*(n+1)}.`,`Stick 25 on the end: ${m*m}`]}}
  if(t<3){const n=ri(1,9),m=n*10+5;return{q:`${m} × ${m}`,a:m*m,steps:[`Front digit ${n} takes the One-More Lift to ${n+1}.`,`${n} × ${n+1} = ${n*(n+1)}.`,`Stick 25 on the end: ${m*m}`]}}
  const f=ri(1,9),u=ri(1,9),x=f*10+u,y=f*10+10-u;
  return{q:`${x} × ${y}`,a:x*y,steps:[`Same front ${f}, backs ${u} + ${10-u} = 10.`,`Front: ${f} × ${f+1} = ${f*(f+1)}.`,`Back: ${u} × ${10-u} = ${p2(u*(10-u))}.`,`Answer: ${x*y}`]}};
G[7]=()=>{const easy=ri(0,1)===0,g=()=>easy?ri(1,3)*10+ri(1,4):ri(12,98);let x=g(),y=g();if(x%10===0)x++;if(y%10===0)y++;
  const t1=Math.floor(x/10),u1=x%10,t2=Math.floor(y/10),u2=y%10,r=u1*u2,c1=Math.floor(r/10),m=t1*u2+u1*t2+c1,c2=Math.floor(m/10),l=t1*t2+c2;
  return{q:`${x} × ${y}`,a:x*y,steps:[`Down right: ${u1} × ${u2} = ${r} → write ${r%10}${c1?`, pass ${c1}`:''}.`,`Cross: ${t1}×${u2} + ${u1}×${t2}${c1?` + ${c1}`:''} = ${m} → write ${m%10}${c2?`, pass ${c2}`:''}.`,`Down left: ${t1} × ${t2}${c2?` + ${c2}`:''} = ${l}.`,`Answer: ${x*y}`]}};
G[8]=()=>{const r=ri(0,5),t=r<=1?0:r===2?1:r<=4?2:3;
  if(t===0){const n=ri(12,9999),st=[];let s=n;while(s>9){const d=String(s).split(''),v=ds(s);st.push(`${d.join(' + ')} = ${v}`);s=v}
    if(s===9)st.push('9 counts as 0.');st.push(`Magic number: ${dr(n)}`);return{q:`Magic number of ${n}?`,a:dr(n),steps:st,smallq:1}}
  if(t===1){const n=ri(10,89),q=Math.floor(n/9),r=n%9,f=Math.floor(n/10),s=f+n%10,ans=`${q} r ${r}`,st=[`Answer part: first digit ${f}. Leftover: ${f} + ${n%10} = ${s}.`];
    if(s>=9)st.push(`${s} is 9 or more, so one more 9 comes out: ${f+1} r ${s-9}.`);st.push(`Answer: ${ans}`);
    const set=new Set([ans]);const opts=[s>=9?`${f} r ${s}`:`${q} r ${(r+1)%9}`,`${q+1} r ${r}`,`${Math.max(0,q-1)} r ${(r+2)%9}`,`${q} r ${(r+3)%9}`];
    for(const o of opts){if(set.size<4)set.add(o)}return{q:`${n} ÷ 9`,a:ans,choices:shuffle([...set]),steps:st}}
  const mul=t===3,a=mul?ri(11,49):ri(15,89),b=mul?ri(2,9):ri(12,89),c=mul?a*b:a+b,wrong=ri(0,1)===1,shown=wrong?c+pick([1,-1,10,-10]):c;
  const ma=dr(a),mb=dr(b),mm=mul?dr(ma*mb):dr(ma+mb),ms=dr(shown);
  return{q:`Is ${a} ${mul?'×':'+'} ${b} = ${shown} right?`,smallq:1,a:wrong?'Wrong':'Right',choices:['Right','Wrong'],steps:[`Magic numbers: ${a} → ${ma}, ${b} → ${mb}, ${shown} → ${ms}.`,`Little sum: ${ma} ${mul?'×':'+'} ${mb} = ${mul?ma*mb:ma+mb}${(mul?ma*mb:ma+mb)!==mm?` → ${mm}`:''}.`,wrong?`${mm} is not ${ms}. No match, so it's a mistake! The real answer is ${c}.`:`${mm} and ${ms} match, so it's right!`]}};
G[9]=()=>pick(G.slice(0,9))();

 {t:'Lightning Ninja',s:'Ūrdhva-Tiryagbhyām · vertically and crosswise',kid:'Down, cross, down. Any 2-digit times 2-digit in one line.',col:'#2E9E6B',belt:5,cards:[

  . |     . .     | .
  . |      X      | .
 right   cross    left</pre><p>Shout them: "Down! Cross! Down!"</p>`},
  {h:'No carrying',b:ex('21 × 13',['Down right: 1 × 3 = 3.','Cross: 2×3 + 1×1 = 7.','Down left: 2 × 1 = 2.'],'= 273')},
  {h:'Passing the ball',b:ex('34 × 26',['Down right: 4 × 6 = 24 → write 4, pass 2.','Cross: 3×6 + 4×2 = 26, + 2 = 28 → write 8, pass 2.','Down left: 3 × 2 = 6, + 2 = 8.'],'= 884')}]},
 {t:'Magic Digit Check',s:'Navaśeṣa · what is left after nines',kid:'A detective trick to check if your answer is right.',col:'#7A4FC0',belt:0,cards:[
  {h:'What is it for?',b:`<p>After you solve a sum, how do you know your answer is right?</p><p>Be a <b>maths detective</b>! Every number has a secret <b>magic number</b>. If the magic numbers agree, your answer is right. If they don't agree, you caught a mistake!</p><p class="tip">First we learn to find a magic number. Then we use it to check answers.</p>`},
  {h:'Find the magic number',b:`<p>Add the digits together. Keep going until only <b>one digit</b> is left.</p>`+ex('23',['2 + 3 = 5','Only one digit is left. Stop!'],'magic number 5')+ex('58',['5 + 8 = 13. That is two digits, so keep going.','1 + 3 = 4'],'magic number 4')+ex('7',['It is already one digit!'],'magic number 7')},
  {h:'Nines are invisible',b:`<p>The number 9 is a ghost. It counts as <b>0</b>, so you can skip it!</p>`+ex('49',['Skip the 9.','Only 4 is left.'],'magic number 4')+ex('18',['1 + 8 = 9','9 is invisible, so it counts as 0.'],'magic number 0')+`<p class="tip">Check the long way: 4 + 9 = 13, then 1 + 3 = 4. Same answer!</p>`},
  {h:'Detective check: plus',b:()=>`<div class="scenewrap">${scCheck()}</div><p>Write the magic number under every number. They make their own <b>little sum</b>. If the little sum is true, the big sum is right.</p>`+ex('Is 21 + 14 = 35?',['Magic numbers: 21 → 3, 14 → 5, 35 → 8.','Little sum: 3 + 5 = 8. True!'],'Right! ✓')},
  {h:'Catch a mistake',b:ex('Is 34 + 25 = 69?',['Magic numbers: 34 → 7, 25 → 7, 69 → 6.','Little sum: 7 + 7 = 14, and 14 → 5.','5 is not 6. No match!'],'Mistake! The real answer is 59.')+`<p class="tip">If the little sum makes a big number, find its magic number too.</p>`},
  {h:'Check times sums too',b:ex('Is 12 × 3 = 36?',['Magic numbers: 12 → 3, 3 → 3, 36 → 9 → 0.','Little sum: 3 × 3 = 9 → 0.','0 and 0 match!'],'Right! ✓')+ex('Is 21 × 4 = 86?',['Magic numbers: 21 → 3, 4 → 4, 86 → 14 → 5.','Little sum: 3 × 4 = 12 → 3.','3 is not 5. No match!'],'Mistake! The real answer is 84.')},
  {h:'Bonus: dividing by 9',b:`<p>Magic numbers also help when you divide by 9!</p>`+ex('23 ÷ 9',['The first digit is the answer: 2.','The magic number (2 + 3 = 5) is the leftover.'],'= 2 r 5')+ex('47 ÷ 9',['First digit 4. Leftover 4 + 7 = 11.','11 is 9 or more, so one more 9 fits: 5, and 11 − 9 = 2.'],'= 5 r 2')}]},
 {t:'Black Belt Tournament',s:'All the sutras',kid:'Every trick, all mixed up. Pick the right one!',col:'#1F2A4D',belt:6,cards:[

U('look','Upasutra 12','Look and See','Vilokanam · by mere observation','Some answers you can see just by looking.','#4DABF7',4,
()=>{const t=ri(0,7),n=ri(12,999);
  if(t===0)return{q:`${n} × 0`,a:0,steps:['Anything times 0 is 0.','Just look. No working needed!']};
  if(t===1)return{q:`${n} × 1`,a:n,steps:['Times 1 keeps a number the same.',`So the answer is ${n}.`]};
  if(t===2)return{q:`${n} − ${n}`,a:0,steps:['A number take away itself leaves nothing.','Answer: 0']};
  if(t===3)return{q:`${n} + 0`,a:n,steps:['Adding 0 changes nothing.',`Answer: ${n}`]};
  if(t===4){const k=ri(1,8);return{q:`${k}99 + 1`,a:(k+1)*100,steps:['99 + 1 makes the next hundred.',`${k}99 + 1 = ${(k+1)*100}`]}}
  if(t===5){const k=ri(2,9);return{q:`${k}000 − 1`,a:k*1000-1,steps:['Taking 1 from thousands makes 9s.',`${k}000 − 1 = ${k*1000-1}`]}}
  if(t===6){const m=ri(2,9),a=ri(12,99);return{q:`${a} + ${m} − ${m}`,a,steps:[`+ ${m} and − ${m} cancel each other.`,`Answer: ${a}`]}}
  const k=ri(2,99);return{q:`${k}0 ÷ 10`,a:k,steps:['Dividing by 10 takes away the last 0.',`Answer: ${k}`]}},
[{h:'Look before you work',b:`<p><b>Vilokanam</b> means "just by looking". Some sums are so easy that you can see the answer without any working.</p><div class="chips"><span class="chip">357 × 0 = 0</span><span class="chip">48 × 1 = 48</span><span class="chip">999 + 1 = 1000</span><span class="chip">25 − 25 = 0</span></div><p class="tip">Before every sum, look for one second. Is there a shortcut?</p>`},
 {h:'Look-out rules',b:ex('6 × 0',['Times 0 is always 0.'],'= 0')+ex('299 + 1',['99 + 1 jumps to the next hundred.'],'= 300')+ex('5000 − 1',['One less than thousands ends in 9s.'],'= 4999')+ex('47 + 8 − 8',['+ 8 and − 8 cancel.'],'= 47')}],
['The look-out owl','The look-out owl uses its telescope. Some answers you can see just by looking!']);

U('parts','Sutra 11','Parts and Whole','Vyaṣṭisamaṣṭiḥ · part and whole','Split numbers into parts, then put the whole back together.','#FF922B',7,
()=>{if(ri(0,3)===0){const w=ri(3,9)*10,p=ri(11,w-11);return{q:`${w} = ${p} + □`,a:w-p,steps:['Part + part = whole.',`Count up from ${p} to ${w}: ${p} + ${w-p} = ${w}.`,`□ = ${w-p}`]}}
  const big=ri(0,3)===0,a=big?ri(110,480):ri(14,79),b=ri(12,69),at=a-a%10,bt=b-b%10,ao=a%10,bo=b%10;
  return{q:`${a} + ${b}`,a:a+b,steps:[`Split into parts: ${a} = ${at} + ${ao}, ${b} = ${bt} + ${bo}.`,`Tens parts: ${at} + ${bt} = ${at+bt}.`,`Ones parts: ${ao} + ${bo} = ${ao+bo}.`,`Whole: ${at+bt} + ${ao+bo} = ${a+b}`]}},
[{h:'Parts make a whole',b:`<p><b>Vyaṣṭisamaṣṭiḥ</b> means "part and whole". A big number is made of small parts: tens and ones.</p>`+ex('47',['47 is 40 + 7.'],'4 tens and 7 ones')+`<p class="tip">Splitting into parts makes hard sums easy.</p>`},
 {h:'Add the parts',b:ex('47 + 38',['Split: 40 + 7 and 30 + 8.','Tens: 40 + 30 = 70.','Ones: 7 + 8 = 15.','Whole: 70 + 15 = 85.'],'= 85')+ex('125 + 34',['Split: 120 + 5 and 30 + 4.','Tens: 120 + 30 = 150.','Ones: 5 + 4 = 9.'],'= 159')},
 {h:'Find the missing part',b:ex('50 = 18 + □',['Part + part = whole.','18 + 2 = 20, then 20 + 30 = 50.','2 + 30 = 32.'],'□ = 32')}],
['The whole and its parts','47 splits into 40 and 7. 38 splits into 30 and 8. Join the tens, join the ones, and you have the whole: 85!']);

U('bridge','Sutra 4','The Flip Bridge','Parāvartya Yojayet · flip and adjust','When a number crosses the = bridge, its sign flips.','#2E9E6B',6,
()=>{const t=ri(0,3);
  if(t===0){const x=ri(3,40),a=ri(2,30),c=x+a;return{q:`□ + ${a} = ${c}`,a:x,steps:[`Move ${a} across the = bridge.`,`Plus flips to minus: ${c} − ${a} = ${x}.`]}}
  if(t===1){const x=ri(12,60),a=ri(2,11),c=x-a;return{q:`□ − ${a} = ${c}`,a:x,steps:[`Move ${a} across the = bridge.`,`Minus flips to plus: ${c} + ${a} = ${x}.`]}}
  if(t===2){const x=ri(2,12),a=ri(2,10),c=x*a;return{q:`${a} × □ = ${c}`,a:x,steps:[`Move ${a} across the = bridge.`,`Times flips to divide: ${c} ÷ ${a} = ${x}.`]}}
  const c=ri(2,10),a=ri(2,9);return{q:`□ ÷ ${a} = ${c}`,a:c*a,steps:[`Move ${a} across the = bridge.`,`Divide flips to times: ${c} × ${a} = ${c*a}.`]}},
[{h:'The flip bridge',b:`<p><b>Parāvartya Yojayet</b> means "flip and adjust". The = sign is a bridge. When a number walks across the bridge, its sign flips over!</p><div class="chips"><span class="chip">+ becomes −</span><span class="chip">− becomes +</span><span class="chip">× becomes ÷</span><span class="chip">÷ becomes ×</span></div>`},
 {h:'Find the hidden number',b:ex('□ + 7 = 15',['7 walks across the bridge.','+ 7 flips to − 7: 15 − 7 = 8.'],'□ = 8')+ex('□ − 5 = 9',['− 5 flips to + 5: 9 + 5 = 14.'],'□ = 14')},
 {h:'Times and divide flip too',b:ex('3 × □ = 24',['× 3 flips to ÷ 3: 24 ÷ 3 = 8.'],'□ = 8')+ex('□ ÷ 4 = 6',['÷ 4 flips to × 4: 6 × 4 = 24.'],'□ = 24')+`<p class="tip">Check: put your answer in the box. Does the sum work?</p>`}],
['The flip bridge','When 7 jumps across the = bridge, its plus flips into a minus. □ + 7 = 15 becomes □ = 15 − 7 = 8.']);

U('cancel','Sutra 5','Same Cancels Out','Śūnyaṃ Sāmyasamuccaye · the same on both sides becomes zero','The same thing on both sides cancels to zero.','#E64980',6,
()=>{const t=ri(0,3),a=ri(3,40),b=ri(2,30);
  if(t===0)return{q:`${a} + ${b} = ${b} + □`,a,steps:[`${b} is on both sides. The same things cancel to zero!`,`What is left: □ = ${a}.`]};
  if(t===1)return{q:`□ + ${b} = ${a} + ${b}`,a,steps:[`${b} is on both sides, so it cancels.`,`□ = ${a}`]};
  if(t===2){const x=ri(2,12),y=ri(2,12);return{q:`${x} × ${y} = ${y} × □`,a:x,steps:[`× ${y} is on both sides, so it cancels.`,`□ = ${x}`]}}
  const c=ri(2,20),d=ri(2,20),e=ri(2,20);return{q:`${c} + ${d} + ${e} = ${e} + ${c} + □`,a:d,steps:[`${c} and ${e} are on both sides. They cancel.`,`□ = ${d}`]}},
[{h:'Same things cancel',b:`<p><b>Śūnyaṃ Sāmyasamuccaye</b> means "when the same thing is on both sides, it becomes zero". Think of a balance scale: the same weight on both pans cancels out.</p>`+ex('6 + 9 = □ + 9',['9 is on both sides. Cancel it!','6 = □'],'□ = 6')},
 {h:'Bigger puzzles',b:ex('25 + 13 = 13 + □',['13 cancels.'],'□ = 25')+ex('4 + 7 + 9 = 9 + 4 + □',['4 and 9 cancel.'],'□ = 7')+ex('6 × 8 = 8 × □',['× 8 cancels.'],'□ = 6')+`<p class="tip">No adding needed. Just cross out the twins!</p>`}],
['The balance scale','The two 9s sit on both sides of the scale. They cancel to zero. What is left? 6 on one side and □ on the other, so □ = 6.']);

U('sumdiff','Sutra 7','Tall and Short Twins','Saṅkalana-vyavakalanābhyām · by adding and by taking away','Know the total and the difference? Add, take away, then halve.','#5C7CFA',14,
()=>{const s=ri(1,12),d=ri(1,8),b=s+d,sum=b+s,big=ri(0,1)===0;
  return{q:`Two numbers add to ${sum}.\nTheir difference is ${d}.\n${big?'Bigger':'Smaller'} number?`,smallq:1,a:big?b:s,steps:[`Bigger: add the total and the difference, then halve. (${sum} + ${d}) ÷ 2 = ${b}.`,`Smaller: take away instead. (${sum} − ${d}) ÷ 2 = ${s}.`,`Check: ${b} + ${s} = ${sum} and ${b} − ${s} = ${d}.`]}},
[{h:'Add and take away',b:`<p><b>Saṅkalana-vyavakalanābhyām</b> means "by adding and by taking away". It finds two secret numbers when you know their total and their difference.</p>`+ex('Add to 10, difference 2',['Bigger: (10 + 2) ÷ 2 = 6.','Smaller: (10 − 2) ÷ 2 = 4.','Check: 6 + 4 = 10 and 6 − 4 = 2.'],'6 and 4')},
 {h:'More secret pairs',b:ex('Add to 14, difference 4',['Bigger: (14 + 4) ÷ 2 = 9.','Smaller: (14 − 4) ÷ 2 = 5.'],'9 and 5')+ex('Add to 20, difference 6',['Bigger: 26 ÷ 2 = 13.','Smaller: 14 ÷ 2 = 7.'],'13 and 7')+`<p class="tip">Halving tip: half of 26 is half of 20 (10) plus half of 6 (3).</p>`}],
['The tall and short twins','Together they make 14. The tall one is 4 more. (14 + 4) ÷ 2 = 9 is the tall one. (14 − 4) ÷ 2 = 5 is the short one.']);

U('steps','Sutra 9','Pattern Steps','Calana-Kalanābhyām · by movement and change','Watch how the numbers move, then take the next step.','#12B886',8,
()=>{const t=ri(0,3);
  if(t<=1){const d=pick([2,3,4,5,6,10,11,25]),a=ri(1,30),up=t===0;const seq=[0,1,2,3].map(k=>up?a+k*d:a+(4-k)*d),nx=up?seq[3]+d:seq[3]-d;
    return{q:`${seq.join(', ')}, ?`,a:nx,steps:[`Look at the change between neighbours: ${up?'+':'−'}${d} each time.`,`${seq[3]} ${up?'+':'−'} ${d} = ${nx}`]}}
  if(t===2){const a=ri(1,6),seq=[a,a*2,a*4,a*8];return{q:`${seq.join(', ')}, ?`,a:a*16,steps:['Each number doubles (× 2).',`${a*8} × 2 = ${a*16}`]}}
  const a=ri(1,10),seq=[a,a+1,a+3,a+6];return{q:`${seq.join(', ')}, ?`,a:a+10,steps:['The jumps grow: + 1, + 2, + 3 …','So the next jump is + 4.',`${a+6} + 4 = ${a+10}`]}},
[{h:'Watch the change',b:`<p><b>Calana-Kalanābhyām</b> means "by movement and change". Grown-ups use it for very big maths. We use it to spot how numbers move.</p>`+ex('3, 7, 11, 15, ?',['Look between neighbours: + 4, + 4, + 4.','15 + 4 = 19.'],'19')},
 {h:'Up, down and growing',b:ex('50, 45, 40, 35, ?',['Each step is − 5.'],'30')+ex('2, 4, 8, 16, ?',['Each number doubles.'],'32')+ex('1, 2, 4, 7, ?',['The jumps grow: + 1, + 2, + 3, so next is + 4.'],'11')}],
['The stepping stones','The frog jumps + 4 on every stone: 3, 7, 11, 15. Where will it land next? 19!']);

U('fruits','Upasutra 11','Fruit Puzzles','Lopanasthāpanābhyām · by hiding and keeping','Find one fruit, keep it, then hide it in the next line.','#F59F00',14,
()=>{const [x,y]=shuffle(['🍎','🍌','🍇','🍓']).slice(0,2),vx=ri(2,9),vy=ri(1,9);
  if(ri(0,1)===0)return{q:`${x} + ${x} = ${vx*2}\n${x} + ${y} = ${vx+vy}\n${y} = ?`,smallq:1,a:vy,steps:[`Line 1: ${x} + ${x} = ${vx*2}, so one ${x} = ${vx}.`,`Keep ${x} = ${vx} and put it in line 2: ${vx} + ${y} = ${vx+vy}.`,`${y} = ${vx+vy} − ${vx} = ${vy}`]};
  return{q:`${x} + ${x} + ${x} = ${vx*3}\n${x} + ${y} = ${vx+vy}\n${y} = ?`,smallq:1,a:vy,steps:[`Line 1: three ${x} make ${vx*3}, so one ${x} = ${vx}.`,`Keep ${x} = ${vx} in line 2: ${vx} + ${y} = ${vx+vy}.`,`${y} = ${vy}`]}},
[{h:'Hide one, keep one',b:`<p><b>Lopanasthāpanābhyām</b> means "by hiding and keeping". In a fruit puzzle, first find one fruit. Then keep its value and use it in the next line.</p>`+ex('🍎 + 🍎 = 10\n🍎 + 🍌 = 9\n🍌 = ?',['Line 1: two apples make 10, so 🍎 = 5.','Keep 🍎 = 5 in line 2: 5 + 🍌 = 9.'],'🍌 = 4')},
 {h:'Three of a kind',b:ex('🍇 + 🍇 + 🍇 = 12\n🍇 + 🍓 = 10\n🍓 = ?',['Three grapes make 12, so 🍇 = 4.','4 + 🍓 = 10.'],'🍓 = 6')+`<p class="tip">Always start with the line that has only one kind of fruit.</p>`}],
['The fruit puzzle','Two apples make 10, so one apple is 5. Keep the apple, use it in the next line, and the banana is easy: 4.']);

U('zeros','Upasutra 3','Fronts and Zeros','Ādyamādyenantyamantyena · the first by the first, the last by the last','Multiply the fronts. The zeros join at the end.','#7950F2',6,
()=>{const a=ri(2,9),b=ri(2,9),za=ri(1,2),zb=ri(0,2),A=a*10**za,B=b*10**zb,z=za+zb;
  return{q:`${A} × ${B}`,a:A*B,steps:[`First by first: ${a} × ${b} = ${a*b}.`,`Last by last, the zeros: ${za} + ${zb} = ${z} zero${z>1?'s':''}.`,`Put them together: ${a*b} and ${'0'.repeat(z)} make ${A*B}`]}},
[{h:'First by first, last by last',b:`<p><b>Ādyamādyenantyamantyena</b> means "the first by the first and the last by the last". Multiply the front digits. Then the zeros at the end join together.</p>`+ex('30 × 40',['First by first: 3 × 4 = 12.','Last by last: 1 zero + 1 zero = 2 zeros.'],'= 1200')},
 {h:'More zeros',b:ex('200 × 3',['2 × 3 = 6.','Zeros: 2.'],'= 600')+ex('60 × 700',['6 × 7 = 42.','Zeros: 1 + 2 = 3.'],'= 42000')+ex('50 × 40',['5 × 4 = 20. It already has its own 0!','Then add the 2 zeros.'],'= 2000')}],
['Fronts and zeros','3 and 4 shake hands to make 12. The zeros float like balloons to the end: 30 × 40 = 1200.']);

U('split','Upasutra 10','Split and Multiply','Samuccayaguṇitaḥ · the sum of the products','Split a number, multiply each part, then add.','#1C7ED6',9,
()=>{const a=ri(2,9),t=ri(1,4)*10,o=ri(1,9),n=t+o;return{q:`${a} × ${n}`,a:a*n,steps:[`Split ${n} into ${t} + ${o}.`,`${a} × ${t} = ${a*t} and ${a} × ${o} = ${a*o}.`,`Add the products: ${a*t} + ${a*o} = ${a*n}`]}},
[{h:'The sum of the products',b:`<p><b>Samuccayaguṇitaḥ</b> means "the sum of the products". Split a number into easy parts, multiply each part, then add.</p>`+ex('7 × 13',['13 = 10 + 3.','7 × 10 = 70 and 7 × 3 = 21.','70 + 21 = 91.'],'= 91')},
 {h:'More splitting',b:ex('4 × 26',['26 = 20 + 6.','4 × 20 = 80 and 4 × 6 = 24.'],'= 104')+ex('6 × 35',['35 = 30 + 5.','6 × 30 = 180 and 6 × 5 = 30.'],'= 210')}],
['Split and multiply','7 cuts 13 into two easy pieces, 10 and 3. 7 × 10 = 70 and 7 × 3 = 21. Add them up: 91.']);

U('box','Upasutra 13','The Magic Box','Guṇitasamuccayaḥ Samuccayaguṇitaḥ · the product of the sums is the sum of the products','Split both numbers, fill the box, add the four squares.','#E8590C',14,
()=>{const a=ri(1,3),b=ri(1,6),c=ri(1,3),d=ri(1,6),x=a*10+b,y=c*10+d,p=[a*c*100,a*10*d,b*c*10,b*d];
  return{q:`${x} × ${y}`,a:x*y,steps:[`Split both: ${x} = ${a*10} + ${b} and ${y} = ${c*10} + ${d}.`,`Box: ${a*10} × ${c*10} = ${p[0]}, ${a*10} × ${d} = ${p[1]}, ${b} × ${c*10} = ${p[2]}, ${b} × ${d} = ${p[3]}.`,`Add the squares: ${p.join(' + ')} = ${x*y}`]}},
[{h:'Fill the box',b:`<p><b>Guṇitasamuccayaḥ Samuccayaguṇitaḥ</b> means "the product of the sums is the sum of the products". Split both numbers, put the parts round a box, multiply into each square, then add.</p><pre class="lay">      10     3
 10 [100]  [30]
  2 [ 20]  [ 6]</pre><div class="exa">12 × 13 = 100 + 30 + 20 + 6 = 156</div>`},
 {h:'More boxes',b:ex('21 × 14',['21 = 20 + 1 and 14 = 10 + 4.','Box: 200, 80, 10, 4.','Add: 294.'],'= 294')+ex('13 × 13',['10 + 3 and 10 + 3.','Box: 100, 30, 30, 9.'],'= 169')}],
['The magic box','Split 12 into 10 and 2, and 13 into 10 and 3. Each square of the box gets a product. Add all four squares: 156.']);

U('lastdig','Upasutra 9','Last Digit Detective','Antyayoreva · only the last ones','The last digits tell you how the answer ends.','#495057',8,
()=>{const x=ri(12,89),y=ri(12,89),c=x*y,ld=(x%10)*(y%10)%10,opts=new Set([c]);
  for(const dl of shuffle([1,2,3,4,5,6,7,8,9,-1,-2,-3,-4,-5,-6,-7])){if(opts.size>=4)break;const v=c+dl;if(v>0&&![...opts].some(o=>o%10===v%10))opts.add(v)}
  return{q:`Which is ${x} × ${y}?`,smallq:1,a:String(c),choices:shuffle([...opts].map(String)),steps:[`Only the last digits: ${x%10} × ${y%10} = ${(x%10)*(y%10)}.`,`So the answer must end in ${ld}.`,`Only ${c} ends in ${ld}!`]}},
[{h:'Only the last digits',b:`<p><b>Antyayoreva</b> means "only the last ones". To find how an answer ends, you only need the last digits!</p>`+ex('How does 37 × 46 end?',['Only the last digits: 7 × 6 = 42.','So 37 × 46 ends in 2.'],'ends in 2')},
 {h:'Detective choices',b:ex('Which is 23 × 14?\n321, 322, 324, 326',['3 × 4 = 12, so it ends in 2.','Only 322 ends in 2.'],'322')+`<p class="tip">This trick also checks your own answers. Wrong last digit? Try again!</p>`}],
['The last-digit detective','The detective looks only at the last digits: 7 and 6. 7 × 6 = 42, so 37 × 46 must end in 2!']);

U('base20','Upasutra 1','Twenty Town','Ānurūpyeṇa · in proportion','The Magic Cross with a new home: 20 or 50.','#D6336C',14,
()=>{const base=pick([20,20,50]),m=base/10,sg=pick([1,-1]),dx=sg*ri(1,3),dy=sg*ri(1,3),x=base+dx,y=base+dy,cr=x+dy,pr=dx*dy;

[{h:'A new home',b:`<p><b>Ānurūpyeṇa</b> means "in proportion". It is the Magic Cross with a new home: 20 (which is 2 tens) or 50 (5 tens).</p>`+ex('22 × 23',['Steps from 20: + 2 and + 3.','Cross: 22 + 3 = 25.','20 is 2 tens: 25 × 2 = 50 tens = 500.','Down: 2 × 3 = 6.'],'500 + 6 = 506')},

()=>{const n=ri(11,49),a=Math.floor(n/10),b=n%10,o=2*b,c1=Math.floor(o/10),t=2*a+b+c1,c2=Math.floor(t/10),h=a+c2;

[{h:'Double and add the neighbour',b:`<p><b>Sopāntyadvayamantyam</b> means "the last and twice the one before". To multiply by 12, go from right to left: <b>double each digit and add its right-hand neighbour</b>.</p>`+ex('23 × 12',['Ones: 2 × 3 = 6.','Tens: 2 × 2 + 3 = 7.','Front: 2.'],'= 276')},

['The ten hug','43 and 47 hug because their last digits, 3 and 7, make 10. The front rides the lift: 4 × 5 = 20. The backs multiply: 3 × 7 = 21. Answer: 2021.']);

[{h:'The magic of 143',b:`<p><b>Kevalaiḥ Saptakaṃ Guṇyāt</b> means "for 7, multiply by 143". The secret: <b>143 × 7 = 1001</b>!</p>`+ex('143 × 14',['14 = 7 × 2.','143 × 7 = 1001, so double it.'],'= 2002')+ex('143 × 21',['21 = 7 × 3.','1001 × 3.'],'= 3003')},

U('lastrem','Sutra 12','Last Digit Leftovers','Śeṣāṇyaṅkena Caramena · the leftovers from the last digit','For ÷ 10, ÷ 2 and ÷ 5, only the last digit matters.','#1971C2',6,
()=>{const t=ri(0,2),n=ri(13,999),l=n%10;
  if(t===0)return{q:`${n} ÷ 10\nleftover?`,smallq:1,a:l,steps:['For ÷ 10, the leftover is just the last digit.',`The last digit of ${n} is ${l}.`]};
  if(t===1)return{q:`${n} ÷ 2\nleftover?`,smallq:1,a:l%2,steps:[`Look only at the last digit: ${l}.`,l%2?`${l} is odd, so 1 is left over.`:`${l} is even, so nothing is left over: 0.`]};
  return{q:`${n} ÷ 5\nleftover?`,smallq:1,a:l%5,steps:[`Look only at the last digit: ${l}.`,l>=5?`${l} − 5 = ${l-5}, so the leftover is ${l%5}.`:`${l} is less than 5, so the leftover is ${l}.`]}},
[{h:'The last digit knows',b:`<p><b>Śeṣāṇyaṅkena Caramena</b> means "the leftovers from the last digit". When you divide by 10, 2 or 5, the last digit tells you what is left over!</p>`+ex('347 ÷ 10',['The last digit is 7.'],'leftover 7')+ex('347 ÷ 2',['7 is odd.'],'leftover 1')+ex('347 ÷ 5',['7 − 5 = 2.'],'leftover 2')},
 {h:'Even and odd',b:`<p>Even last digits (0, 2, 4, 6, 8) leave 0 when you ÷ 2.<br>Odd last digits (1, 3, 5, 7, 9) leave 1.</p>`+ex('5618 ÷ 2',['The last digit 8 is even.'],'leftover 0')+ex('93 ÷ 5',['The last digit 3 is less than 5.'],'leftover 3')}],
['The number train','Only the last carriage matters! For 347 the last carriage is 7. ÷ 10 leaves 7, ÷ 2 leaves 1 and ÷ 5 leaves 2.']);

U('remstay','Upasutra 2','The Leftover Stays','Śiṣyate Śeṣasaṃjñaḥ · the remainder stays the same','Add whole jumps and the leftover does not change.','#F08C00',8,
()=>{const d=ri(3,9),r=ri(1,d-1);
  if(ri(0,1)===0){const n1=d*ri(1,5)+r,k=ri(1,4),n2=n1+d*k;return{q:`${n1} ÷ ${d} → leftover ${r}\n${n2} ÷ ${d} → leftover ?`,smallq:1,a:r,steps:[`${n2} is ${n1} + ${d*k}, and ${d*k} is in the ${d} times table.`,`Adding whole ${d}s does not change the leftover. It stays ${r}.`]}}
  const m=d*ri(2,9);return{q:`${m+r} ÷ ${d}\nleftover?`,smallq:1,a:r,steps:[`${m} is in the ${d} times table.`,`${m+r} = ${m} + ${r}, so ${r} is left over.`]}},
[{h:'The leftover stays',b:`<p><b>Śiṣyate Śeṣasaṃjñaḥ</b> means "the leftover stays the same". If you add a whole jump of the number you divide by, the leftover does not change.</p>`+ex('7 ÷ 5 leaves 1',['12 = 7 + 5 and 17 = 7 + 10.','So 12 ÷ 5 and 17 ÷ 5 leave 1 too!'],'leftover 1')},
 {h:'Find the leftover fast',b:ex('23 ÷ 4',['20 is in the 4 times table.','23 = 20 + 3.'],'leftover 3')+ex('47 ÷ 6',['42 is in the 6 times table.','47 = 42 + 5.'],'leftover 5')}],
['Jumping by 5s','5 jumps along by 5s: 2, 7, 12, 17, 22. Each time you divide by 5, the leftover is still 2!']);

U('seven','Upasutra 5','The 7 Hug Test','Veṣṭanam · by hugging (osculation)','Is it in the 7 times table? Hug the last digit with 5!','#099268',12,
()=>{const yes=ri(0,1)===0;let n;do{n=yes?7*ri(2,20):ri(14,140)}while(!yes&&n%7===0);
  const r=Math.floor(n/10),l=n%10,v=r+5*l,ok=n%7===0;
  return{q:`Is ${n} in the 7 times table?`,smallq:1,a:ok?'Yes':'No',choices:['Yes','No'],steps:[`Hug the last digit: ${l} × 5 = ${5*l}.`,`Add it to the rest: ${r} + ${5*l} = ${v}.`,ok?`${v} is in the 7 times table, so YES!`:`${v} is not in the 7 times table, so NO.`]}},
[{h:'The 7 hug test',b:`<p><b>Veṣṭanam</b> means "hugging". Is a number in the 7 times table? Hug the last digit with 5!</p><ol><li>Multiply the last digit by 5.</li><li>Add it to the rest of the number.</li><li>Is the result in the 7 times table? Then the number is too!</li></ol>`+ex('91',['Last digit 1 × 5 = 5.','9 + 5 = 14, and 14 is 7 × 2.'],'Yes!')},
 {h:'More hugs',b:ex('84',['4 × 5 = 20.','8 + 20 = 28 = 7 × 4.'],'Yes!')+ex('65',['5 × 5 = 25.','6 + 25 = 31. Not in the 7 times table.'],'No')+ex('133',['3 × 5 = 15.','13 + 15 = 28 = 7 × 4.'],'Yes!')}],
['The 7 hug','In 91, the last digit 1 hugs the front with 5: 9 + 5 = 14. 14 is in the 7 times table, so 91 is too!']);

U('ratio','Sutra 6','The Ratio Ladder','Ānurūpye Śūnyamanyat · if one is in proportion, the other is zero','When one side grows some times, the other grows the same times.','#C2255C',10,
()=>{const [it,unit,per]=pick([['pencils','CHF',0],['apples','CHF',0],['cars','wheels',4],['spiders','legs',8],['bags','sweets',0]]),a=ri(2,5),p=per||ri(2,6),c=a*p,k=ri(2,4),b=a*k;

  return{q:`${b} ${it} → ${c*k} ${unit}\n${a} ${it} → ? ${unit}`,smallq:1,a:c,steps:[`${a} is ${b} ÷ ${k}.`,`So divide by ${k} too: ${c*k} ÷ ${k} = ${c}.`]}},
[{h:'Keep it in proportion',b:`<p><b>Ānurūpye Śūnyamanyat</b> means "if one is in proportion, the other is zero". Grown-ups use it for equations. The idea behind it: <b>when one thing grows some times, the other grows the same times</b>.</p>`+ex('3 pencils → 6 CHF\n9 pencils → ?',['9 is 3 times 3.','So the cost is 3 times too: 6 × 3.'],'18 CHF')},

U('factors','Sutra 16','Factor Friends','Guṇakasamuccayaḥ · the factors and their sum','Find two numbers that multiply to one number and add to another.','#7048E8',12,
()=>{let a,b,P,pairs;do{a=ri(1,9);b=ri(a,12);P=a*b;pairs=[];for(let i=1;i*i<=P;i++)if(P%i===0)pairs.push([i,P/i])}while(pairs.length<2&&ri(0,3)>0);
  const S2=a+b,lab=p=>`${p[0]} and ${p[1]}`,ch=new Set([lab([a,b])]);for(const p of shuffle(pairs.slice()))if(ch.size<4)ch.add(lab(p));
  let k=1;while(ch.size<3){const f=[Math.max(1,a-k),b+k];if(f[0]*f[1]!==P)ch.add(lab(f));k++}
  return{q:`Two numbers multiply to ${P}\nand add to ${S2}.\nWhich pair?`,smallq:1,a:lab([a,b]),choices:shuffle([...ch]),steps:[`Factor pairs of ${P}: ${pairs.map(lab).join(', ')}.`,`Which pair adds to ${S2}? ${a} + ${b} = ${S2}.`,`Answer: ${a} and ${b}`]}},
[{h:'Factor friends',b:`<p><b>Guṇakasamuccayaḥ</b> means "the factors and their sum". Grown-ups use it to break big expressions into factors. We play the game behind it: find two numbers that <b>multiply</b> to one number and <b>add</b> to another.</p>`+ex('Multiply to 12, add to 7',['Factor pairs of 12: 1 and 12, 2 and 6, 3 and 4.','Which adds to 7? 3 + 4 = 7.'],'3 and 4')},
 {h:'More factor friends',b:ex('Multiply to 18, add to 9',['Pairs: 1 and 18, 2 and 9, 3 and 6.','3 + 6 = 9.'],'3 and 6')+ex('Multiply to 24, add to 10',['Pairs: 1 and 24, 2 and 12, 3 and 8, 4 and 6.','4 + 6 = 10.'],'4 and 6')+`<p class="tip">Draw the number as a rectangle of dots. Each rectangle is a factor pair!</p>`}],
['Factor friends','12 dots make a 3 by 4 rectangle. 3 × 4 = 12 and 3 + 4 = 7. Those two are factor friends!']);

  s+=T(above?fx+step*gap/2+6:fx-step*gap/2-6,98,`${gap} step${gap>1?'s':''} ${above?'above':'below'}`,11,'#E0445A');

const boltIcon=`<svg class="bi" viewBox="0 0 24 24" aria-hidden="true"><polygon points="14,2 4,14 11,14 9,22 20,9 13,9 15,2" fill="#FFD43B" stroke="#C98A00" stroke-width="1.5" stroke-linejoin="round"/></svg>`;

function makeQ(u,seen){let q,k=0;do{q=G[u]();k++}while(seen.has(q.q)&&k<60);seen.add(q.q);return q}
function newQuiz(u,mode){const ta=mode==='ta',prac=mode==='p50',total=ta?0:prac?50:+mode,seen=new Set(),qs=[];
  for(let k=0;k<(ta?1:total);k++)qs.push(makeQ(u,seen));
  const now=performance.now();
  return{u,mode,ta,prac,total,qs,seen,i:0,correct:0,answered:0,stars:0,light:0,times:[],input:'',state:'ask',picked:null,qStart:now,taEnd:ta?now+60000:0,lastSec:61,done:false}}

function clockHTML(q,t){
  const l=limitOf(q,quiz.u),sp=speedOf(q,quiz.u,t),w=Math.max(0,1-t/(2*l))*100;
  return `<div class="clock z${sp}" id="clock"><div class="ctrack"><b id="cbar" style="width:${w}%"></b></div><span class="ctime" id="ctime">${t.toFixed(1)} s</span><span class="czone" id="czone">${SPEEDNAME[sp]} ${'★'.repeat(sp)}</span></div>`;
}
function paintClock(q,t){
  const c=document.getElementById('clock');if(!c)return;const l=limitOf(q,quiz.u),sp=speedOf(q,quiz.u,t);
  c.className='clock z'+sp;document.getElementById('cbar').style.width=Math.max(0,1-t/(2*l))*100+'%';
  document.getElementById('ctime').textContent=t.toFixed(1)+' s';document.getElementById('czone').textContent=SPEEDNAME[sp]+' '+'★'.repeat(sp);
}

function quizScreen(){
  const q=quiz.qs[quiz.i],st=quiz.state;
  const ansCls=st==='right'?'ok':st==='wrong'?'bad':'';
  let body='';
  if(q.choices){body=`<div class="choices">${q.choices.map(c=>{let cl='';if(st!=='ask'){if(c===q.a)cl='ok';else if(c===quiz.picked)cl='bad'}return `<button data-choice="${esc(c)}" class="${cl}" ${st!=='ask'?'disabled':''}>${esc(c)}</button>`}).join('')}</div>`}
  else{body=`<div class="answer ${ansCls}" aria-live="polite">${quiz.input||'?'}</div>`}
  let fb='';
  if(st==='right'){
    if(quiz.ta)fb=`<div class="fb ok pop"><h3>${pick(['Yes!','Strike!','Super!','Zap!'])} +1</h3></div>`;
    else{const sp=q.sp,word=sp===3?pick(['LIGHTNING!','Super speed!','Ninja flash!']):sp===2?pick(['Quick strike!','Nice and fast!','Great!']):pick(['Correct!','You got it!','Well done!']);
      fb=`<div class="fb ok pop sp${sp}"><h3>${sp===3?boltIcon:''}${word} +${sp} star${sp>1?'s':''}</h3>${quiz.prac?'':`<span class="tip">${q.t.toFixed(1)} seconds</span>`}</div>`}}
  if(st==='wrong')fb=quiz.ta?`<div class="fb bad pop"><h3>The answer is ${q.a}</h3></div>`:`<div class="fb bad pop"><h3>Almost! The answer is ${q.a}</h3><div class="fbpic">${scenePic(quiz.u)}</div><ol>${q.steps.map(s=>`<li>${s}</li>`).join('')}</ol><button class="btn block" data-next>Next question</button></div>`;
  const pad=(!q.choices&&st==='ask')?`<div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join('')}<button class="del" data-k="del" aria-label="Delete">⌫</button><button data-k="0">0</button><button class="go" data-k="ok" aria-label="Check">✓</button></div>`:'';
  const now=performance.now();
  let top,clock='';
  if(quiz.ta){const left=Math.max(0,(quiz.taEnd-now)/1000);
    top=`<div class="qbar"><button class="iconbtn" data-quit aria-label="Stop Time Attack">×</button><div class="prog tap"><b id="pbar" style="width:${left/60*100}%"></b></div><div class="tatime ${left<=10?'hurry':''}" id="tat">${Math.ceil(left)}</div><div class="starpill">${starIcon()}${quiz.correct}</div></div>`;
  }else{
    top=`<div class="qbar"><button class="iconbtn" data-quit aria-label="Stop practice">×</button><div class="prog"><b style="width:${quiz.i/quiz.total*100}%"></b></div><div class="starpill">${starIcon()}${quiz.stars}</div></div>`;
    clock=quiz.prac?'':clockHTML(q,st==='ask'?(now-quiz.qStart)/1000:q.t);
  }
  const qn=quiz.ta?`Lightning Round · ${quiz.correct} of ${needOf(quiz.u,'ta')} needed`:quiz.prac?`Practice · question ${quiz.i+1} of 50 · ${quiz.correct} right`:`Question ${quiz.i+1} of ${quiz.total} · ${quiz.correct} right, need ${needOf(quiz.u,quiz.mode)}`;
  return `${top}
  <section class="qcard"><div class="qnum">${qn} · ${esc(UNITS[quiz.u].t)}</div>${clock}<div class="qtext ${q.smallq?'smallq':''}">${esc(q.q)}</div>${body}</section>${fb}${pad}
  ${view.quitAsk?`<div class="panel"><b>${quiz.prac?'Finish practice now? You keep your stars, and 25 answers or more still wins a gift.':'Stop this round? You will not get a prize for it.'}</b><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn small ghost" data-quitno>Keep going</button>${quiz.prac?'<button class="btn small green" data-finishnow>Finish now</button>':'<button class="btn small" data-quityes>Stop</button>'}</div></div>`:''}`;

function answer(val){
  const q=quiz.qs[quiz.i];if(quiz.state!=='ask'||quiz.done)return;
  const t=(performance.now()-quiz.qStart)/1000;q.t=t;quiz.answered++;
  const ok=String(val)===String(q.a);quiz.picked=val;const idx=quiz.i;
  if(ok){quiz.correct++;quiz.times.push(t);
    const sp=quiz.ta||quiz.prac?1:speedOf(q,quiz.u,t);q.sp=sp;quiz.stars+=sp;if(!quiz.ta&&sp===3)quiz.light++;
    quiz.state='right';(sp===3?sfx.zap:sfx.right)();render();setTimeout(()=>nextQ(idx),quiz.ta?450:1000)}
  else{quiz.state='wrong';sfx.wrong();render();if(quiz.ta)setTimeout(()=>nextQ(idx),1400)}
}
function nextQ(idx){
  if(!quiz||quiz.done||idx!==quiz.i)return;
  quiz.i++;quiz.input='';quiz.picked=null;quiz.state='ask';
  if(quiz.ta)quiz.qs.push(makeQ(quiz.u,quiz.seen));
  if(!quiz.ta&&quiz.i>=quiz.total){finish();return}
  quiz.qStart=performance.now();render();
}

function finish(){
  if(quiz.done)return;quiz.done=true;
  if(quiz.prac){const u=quiz.u,c=quiz.correct,tot=quiz.answered,rw=[],tm=quiz.times,tt=tm.reduce((a,b)=>a+b,0);
    if(!S.test){S.stars+=c;if(tot>=50&&(S.bestP[u]==null||c>S.bestP[u]))S.bestP[u]=c;if(tot>=25)giveGift(rw);if(tot>=50&&c===50){const r=RARE.find(k=>!S.items.includes(k));if(r){S.items.push(r);equip(r);rw.push({type:'rare',k:r})}}save()}
    lastRewards=rw.map(r=>({...r,open:false}));
    go({name:'result',u,c,tot,ta:false,prac:1,mode:'p50',earned:c,light:0,avg:tm.length?tt/tm.length:0,total:tt,passed:true,need:0,sn:'Practice',test:S.test?1:0});
    setTimeout(()=>{sfx.win();confetti(80)},150);return}
  if(S.test){const u=quiz.u,c=quiz.correct,tot=quiz.ta?quiz.answered:quiz.total,need=needOf(u,quiz.mode),tm=quiz.times,tt=tm.reduce((a,b)=>a+b,0);lastRewards=[];
    go({name:'result',u,c,tot,ta:quiz.ta,mode:quiz.mode,earned:quiz.stars,light:quiz.light,avg:tm.length?tt/tm.length:0,total:tt,passed:c>=need,need,sn:stageOf(quiz.mode).n,test:1});return}
  const u=quiz.u,ta=quiz.ta,c=quiz.correct,tot=ta?quiz.answered:quiz.total,rw=[];
  const avg=quiz.times.length?quiz.times.reduce((a,b)=>a+b,0)/quiz.times.length:0;
  let earned=quiz.stars,rec=null;
  if(ta){const prev=S.bestTA[u]||0;if(c>prev){S.bestTA[u]=c;if(prev>0){earned+=5;rec={type:'record',ta:1,c,prev}}}}
  else{const b=S.best[u];if(!b||c/tot>b.c/b.t||(c/tot===b.c/b.t&&tot>b.t))S.best[u]={c,t:tot};
    if(c/tot>=.8){const prev=S.bestAvg[u];if(!prev||avg<prev){S.bestAvg[u]=avg;if(prev)rec={type:'record',avg,prev}}}}
  S.stars+=earned;S.light+=quiz.light;
  if(!ta||c>=Math.min(5,needOf(u,'ta'))){const reg=REG.find(k=>!S.items.includes(k));
    if(reg){S.items.push(reg);equip(reg);rw.push({type:'item',k:reg})}
    else{const gi=GIS.findIndex((_,i)=>!S.gis.includes(i));if(gi>=0){S.gis.push(gi);S.gi=gi;rw.push({type:'gi',i:gi})}else{S.trophies++;rw.push({type:'trophy'})}}}
  if(!ta&&c===tot){const r=RARE.find(k=>!S.items.includes(k));if(r){S.items.push(r);equip(r);rw.push({type:'rare',k:r})}else{S.stars+=10;rw.push({type:'bonus'})}}
  const speedy=ta?(rec&&c>=10):quiz.light>=Math.ceil(tot*.6);
  if(speedy){const s=SPEED.find(k=>!S.items.includes(k));if(s){S.items.push(s);equip(s);rw.push({type:'speed',k:s})}else{S.stars+=5;rw.push({type:'speedbonus'})}}
  const need=needOf(u,quiz.mode),passed=c>=need,stg=stageOf(quiz.mode),wasUnit=unitDone(u);
  if(passed&&!stDone(u,stg.k)){(S.stages[u]=S.stages[u]||{})[stg.k]=1;
    if(unitDone(u)&&!wasUnit){rw.push({type:'sutra',u});const bi=UNITS[u].belt;if(bi&&S.belt<bi){S.belt=bi;rw.push({type:'belt',i:bi})}
      relock();if(u+1<UNITS.length)rw.push({type:'unlock',i:u+1})}
    else{const nx=nextStage(u);if(nx<4)rw.push({type:'stage',k:nx})}}
  if(rec)rw.unshift(rec);
  save();lastRewards=rw.map(r=>({...r,open:r.type==='unlock'||r.type==='record'||r.type==='stage'}));
  go({name:'result',u,c,tot,ta,mode:quiz.mode,earned,light:quiz.light,avg,total:quiz.times.length?quiz.times.reduce((a,b)=>a+b,0):0,passed,need,sn:stg.n});
  setTimeout(()=>{sfx.win();confetti(c===tot&&!ta?160:80)},150);
}
setInterval(()=>{
  if(view.name!=='quiz'||!quiz||quiz.done)return;const now=performance.now();
  if(quiz.ta){const left=Math.max(0,(quiz.taEnd-now)/1000),sec=Math.ceil(left);
    const el=document.getElementById('tat');if(el){el.textContent=sec;el.classList.toggle('hurry',left<=10)}

},100);

function wardrobe(){

  const sw=GIS.map((g,i)=>{const own=S.gis.includes(i);return `<button class="sw ${S.gi===i?'on':''} ${own?'':'locked'}" style="background:${g.c}" data-gi="${i}" ${own?'':'disabled'} aria-label="${g.n} uniform${own?'':' (locked)'}"></button>`}).join('');
  const foods=FOODS.map(f=>`<div class="food"><div class="ficon">${foodSVG(f.k)}</div><div class="fn">${f.n}</div><div class="pw">+${f.p} power</div><button class="btn small ${S.stars>=f.c?'green':'ghost'}" data-feed="${f.k}" ${S.stars>=f.c?'':'disabled'} aria-label="Feed ${f.n} for ${f.c} stars">${starIcon()}${f.c}</button></div>`).join('');
  const yum=view.yum?`<div class="yumbar pop"><b>Yum! ${view.yum.n}.</b> +${view.yum.p} power.${view.yum.up?` <b>Level up! Your hero is now a ${TITLES[view.yum.up]}!</b>`:''}</div>`:'';
  return `<div class="top"><button class="iconbtn" data-go="home" aria-label="Back">‹</button><h2>Hero Lab</h2><div class="starpill">${starIcon()}${S.stars}</div></div>
  <section class="hero"><div class="stage ${view.yum?'yum':''}">${ninja({eq:S.eq,gi:S.gi,belt:S.belt})}</div><div class="rank"><label class="meta" for="nm">Hero name</label><div class="namebox"><input id="nm" maxlength="14" value="${esc(S.name)}"></div>${powerHTML()}${S.trophies?`<div class="meta">Gold trophies: ${S.trophies}</div>`:''}</div></section>
  ${yum}
  <div class="panel"><b>1. Create your hero</b><div class="spcgrid">${spc}</div>${skins}<div class="sub2"><b>Uniform colour</b><div class="swatches">${sw}</div></div><span class="note">The dragon unlocks at the Green belt. More uniform colours unlock after all the outfit pieces are found.</span></div>
  <div class="panel"><b>2. Feed your hero healthy food</b><span class="note">Spend stars on healthy food. Every bite makes your hero stronger!</span><div class="foods">${foods}</div></div>
  <h2>3. Weapons</h2><div class="wardgrid">${weapons.map(card).join('')}</div>
  <h2>4. Armour and outfit</h2><div class="wardgrid">${outfit.map(card).join('')}</div>
  <div class="panel"><span class="note">For grown-ups: sound is ${S.sound?'on':'off'}.</span><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn small ghost" data-sound>${S.sound?'Turn sound off':'Turn sound on'}</button><button class="btn small ghost" data-test>${S.test?'Turn test mode off':'Test mode: open all levels'}</button></div>
  <div class="sub2"><b>Move progress to another device</b><span class="note">Tap Copy progress code here. Then open Ninja Maths Dojo on the other device, paste the code in this box and tap Load.</span><textarea id="pcode" rows="3" placeholder="Progress code">${esc(view.pcode||'')}</textarea><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn small ghost" data-export>Copy progress code</button><button class="btn small ghost" data-import>Load progress code</button></div>${view.pmsg?`<span class="note"><b>${view.pmsg}</b></span>`:''}</div>
  ${view.resetAsk?`<b>Erase all stars, belts and items?</b><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn small ghost" data-resetno>Keep everything</button><button class="btn small" style="background:var(--wrong);box-shadow:0 5px 0 #A92B3E" data-resetyes>Erase</button></div>`:`<button class="danger" data-reset>Start over</button>`}</div>`;
}

function render(){
  if(view.name==='home')app.innerHTML=home();
  else if(view.name==='unit')app.innerHTML=unitScreen(view.u);
  else if(view.name==='quiz')app.innerHTML=quizScreen();
  else if(view.name==='result')app.innerHTML=resultScreen();
  else if(view.name==='wardrobe')app.innerHTML=wardrobe();
  else if(view.name==='cards')app.innerHTML=cardsScreen();
}
function cardsScreen(){const n=UNITS.filter((_,i)=>unitDone(i)).length;
  return `<div class="top"><button class="iconbtn" data-go="home" aria-label="Back">‹</button><h2>Sutra cards</h2><div class="starpill">${n}/${UNITS.length}</div></div>
  <p class="note">Finish all 4 missions of a sutra to collect its card.</p>
  <div class="cardlist">${UNITS.map((u,i)=>{if(unitDone(i))return `<article class="scard">${scenePic(i)}<div class="scap"><span class="disc" style="background:${u.col}">${i+1}</span><div><b>${esc(u.t)}</b><div class="sutra"><b>${esc(u.tag)}</b> · ${esc(u.s)}</div><div class="skid">${esc(u.kid)}</div></div></div></article>`;
    const left=4-nextStage(i);
    return `<article class="scard locked"><div class="lockbox"><span class="disc" style="background:#AEB59A">${i+1}</span><b>Secret sutra card</b><span class="note">${i<=S.unlocked?`${left} mission${left>1?'s':''} left in ${esc(u.t)}`:'Not open yet'}</span></div></article>`}).join('')}</div>`;
}

/* ---------- events ---------- */
app.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;
  if(d.go){sfx.tap();go({name:d.go});return}
  if(d.unit){sfx.tap();lessonIdx=0;go({name:'unit',u:+d.unit});return}
  if(d.lesson){lessonIdx=Math.max(0,Math.min(UNITS[view.u].cards.length-1,lessonIdx+ +d.lesson));sfx.tap();render();return}
  if(d.start){quiz=newQuiz(+d.start,d.n||'10');sfx.tap();go({name:'quiz'});return}
  if(d.k){if(quiz.state!=='ask')return;if(d.k==='del')quiz.input=quiz.input.slice(0,-1);else if(d.k==='ok'){if(quiz.input)answer(quiz.input);return}else if(quiz.input.length<7)quiz.input=(quiz.input+d.k).replace(/^0+(?=\d)/,'');sfx.tap();render();return}
  if(d.choice!=null){answer(d.choice);return}
  if('next' in d){nextQ(quiz.i);return}
  if('quit' in d){view.quitAsk=true;render();return}
  if('quitno' in d){view.quitAsk=false;render();return}
  if('quityes' in d){quiz=null;lessonIdx=0;go({name:'home'});return}
  if(d.open!=null){const r=lastRewards[+d.open];r.open=true;sfx.gift();confetti(r.type==='rare'||r.type==='belt'?150:60);render();return}
  if(d.wear){const k=d.wear,before=levelOf(power());if(S.eq.includes(k))S.eq=S.eq.filter(x=>x!==k);else equip(k);save();sfx.tap();view.yum=null;if(levelOf(power())>before)confetti(100);render();return}
  if(d.sp){S.sp=d.sp;save();sfx.tap();view.yum=null;render();return}
  if(d.skin){S.skin=d.skin;save();sfx.tap();view.yum=null;render();return}
  if(d.feed){const fd=FOODS.find(x=>x.k===d.feed);if(!fd||S.stars<fd.c)return;const before=levelOf(power());S.stars-=fd.c;S.foodP=(S.foodP||0)+fd.p;S.fed=S.fed||{};S.fed[fd.k]=(S.fed[fd.k]||0)+1;const after=levelOf(power());save();view.yum={n:fd.n,p:fd.p,up:after>before?after:0};sfx.gift();if(after>before)confetti(120);render();return}
  if(d.gi!=null){S.gi=+d.gi;save();sfx.tap();render();return}
  if('sound' in d){S.sound=!S.sound;save();render();return}
  if('exstep' in d){EX.shown++;render();document.querySelector('.lesson')?.classList.remove('pop');return}
  if('exnew' in d){EX={u:EX.u,q:G[EX.u](),shown:0,n:EX.n+1};render();document.querySelector('.lesson')?.classList.remove('pop');return}
  if('finishnow' in d){view.quitAsk=false;finish();return}
  if('export' in d){const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));view.pcode=code;view.pmsg='Code ready and copied. If it did not copy, select the code in the box and copy it.';try{navigator.clipboard.writeText(code).catch(()=>{view.pmsg='Code ready. Select the code in the box and copy it.';render()})}catch(err){view.pmsg='Code ready. Select the code in the box and copy it.'}render();return}
  if('import' in d){const t=((document.getElementById('pcode')||{}).value||'').trim();try{const o=JSON.parse(decodeURIComponent(escape(atob(t))));if(!o||typeof o!=='object'||!('stars' in o))throw 0;S=Object.assign(fresh(),o);relock();save();view.pcode='';view.pmsg='Progress loaded!'}catch(err){view.pmsg='That code did not work. Copy the whole code and try again.'}render();return}
  if('test' in d){S.test=!S.test;save();render();return}
  if('reset' in d){view.resetAsk=true;render();return}
  if('resetno' in d){view.resetAsk=false;render();return}
  if('resetyes' in d){const snd=S.sound;S=fresh();S.sound=snd;save();go({name:'home'});return}
});
app.addEventListener('input',e=>{if(e.target.id==='nm'){S.name=e.target.value.trim()||'Ninja';save()}if(e.target.id==='pcode')view.pcode=e.target.value});
document.addEventListener('keydown',e=>{
  if(view.name!=='quiz'||!quiz||e.target.tagName==='INPUT')return;const q=quiz.qs[quiz.i];
  if(quiz.state==='wrong'&&e.key==='Enter'&&!quiz.ta){nextQ(quiz.i);return}
  if(quiz.state!=='ask'||q.choices)return;
  if(/^\d$/.test(e.key)&&quiz.input.length<7){quiz.input=(quiz.input+e.key).replace(/^0+(?=\d)/,'');render()}
  else if(e.key==='Backspace'){quiz.input=quiz.input.slice(0,-1);render()}
  else if(e.key==='Enter'&&quiz.input)answer(quiz.input);
});
render();
</script>

<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
</body>
